<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <!-- Source for the PNG icons. Re-render with: npm run icons -->
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1" />
      <stop offset="1" stop-color="#4338ca" />
    </linearGradient>
  </defs>

  <!-- Rounded tile -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#background)" />

  <!-- Table: white sheet with a tinted header row and grid lines -->
  <rect x="24" y="28" width="72" height="64" rx="9" fill="#ffffff" />
  <path d="M24 37a9 9 0 0 1 9-9h54a9 9 0 0 1 9 9v9H24z" fill="#c7d2fe" />
  <g stroke="#a5b4fc" stroke-width="4">
    <line x1="24" y1="65" x2="96" y2="65" />
    <line x1="48" y1="28" x2="48" y2="92" />
    <line x1="72" y1="28" x2="72" y2="92" />
  </g>

  <!-- Download badge -->
  <circle cx="94" cy="94" r="24" fill="#10b981" stroke="#4338ca" stroke-width="6" />
  <g fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="94" y1="82" x2="94" y2="104" />
    <polyline points="85,96 94,105 103,96" />
  </g>
</svg>
